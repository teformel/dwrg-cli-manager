# .github/workflows/codeql.yml
# 代码安全扫描：Python CodeQL，push / PR 触发，并每周全量扫描一次。
name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 01:30 UTC（即北京时间 09:30）做一次全量扫描
    - cron: "30 1 * * 1"

# 顶层最小权限，具体作业按需提升
permissions:
  contents: read

jobs:
  analyze:
    name: 分析 Python
    runs-on: ubuntu-latest

    permissions:
      # 上传 SARIF 结果到 code scanning 需要
      security-events: write
      # 读取 Actions 元数据（私有仓库需 actions: read）
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ["python"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: 自动构建
        # Python 无需编译，此步仅用于让 CodeQL 收集解释器与依赖环境信息
        uses: github/codeql-action/autobuild@v3

      - name: 执行 CodeQL 分析
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
